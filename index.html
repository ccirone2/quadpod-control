<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<title>Quadpod</title>
<meta name="description" content="Bluetooth control page for the quadpod robot (Web Bluetooth, Android Chrome).">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top">
  <div class="who">
    <span id="dot" class="dot" aria-hidden="true"></span>
    <div>
      <h1>Quadpod</h1>
      <div id="status" role="status" aria-live="polite">not connected</div>
    </div>
  </div>
  <div class="actions">
    <button id="connect" class="btn">Connect</button>
    <button id="estop" class="btn bad" title="Tap: stop and hold. Hold 1 s: power the servos off" aria-label="Stop. Hold for one second to power the servos off">STOP</button>
  </div>
</header>

<main id="view" role="tabpanel"></main>

<nav id="tabs" role="tablist" aria-label="Sections"></nav>

<script type="module" src="js/app.js"></script>
</body>
</html>
