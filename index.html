<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<title>Quadpod</title>
<meta name="description" content="Bluetooth control page for the quadpod robot (Web Bluetooth, Android Chrome).">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top">
  <div class="who">
    <span id="dot" class="dot" aria-hidden="true"></span>
    <div>
      <h1>Quadpod</h1>
      <div id="status">not connected</div>
    </div>
  </div>
  <div class="actions">
    <button id="connect" class="btn">Connect</button>
    <button id="estop" class="btn bad" title="Stop walking and power the servos off">STOP</button>
  </div>
</header>

<main id="view"></main>

<nav id="tabs" aria-label="Sections"></nav>

<script type="module" src="js/app.js"></script>
</body>
</html>
